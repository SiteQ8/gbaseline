name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/data/**', 'data/inventory/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: The bundle matches its sources
        run: node scripts/build.mjs --check
      - name: The printed pages match the data
        run: node scripts/prerender.mjs --check
      - name: Engine, probes, pipeline, data, naming, MCP and site
        run: npm test
      - name: MCP selftest
        run: npm run selftest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: The site in Arabic and English, on a desktop and a phone
        run: node test/ui.mjs
